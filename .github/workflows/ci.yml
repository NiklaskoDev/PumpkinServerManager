name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: |
          set -o pipefail
          pytest --junitxml=junit.xml 2>&1 | tee pytest.log
      # Job logs are private, but annotations are shown on the run page (and readable by anyone for a public repo),
      # so failing tests are repeated there with their assertion message.
      - name: Show failing tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          CR, LF = chr(13), chr(10)

          def esc(text):
              return text.replace("%", "%25").replace(CR, "%0D").replace(LF, "%0A")

          def esc_prop(text):
              return esc(text).replace(":", "%3A").replace(",", "%2C")

          shown = 0
          if os.path.exists("junit.xml"):
              for case in ET.parse("junit.xml").getroot().iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  title = esc_prop(case.get("classname", "") + "::" + case.get("name", ""))
                  text = (problem.get("message") or "") + LF + (problem.text or "")
                  print("::error title=" + title + "::" + esc(text[:1800]))
                  shown += 1
                  if shown >= 10:
                      break
          if not shown:
              tail = "no pytest output"
              if os.path.exists("pytest.log"):
                  tail = open("pytest.log", encoding="utf-8", errors="replace").read()[-1800:]
              print("::error title=pytest did not report a failing test::" + esc(tail))
          PY

  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    # Deliberately independent of the unit tests (see the publish job).
    steps:
      - uses: actions/checkout@v4
      - name: Build (amd64)
        run: docker build -t pumpkin-manager:ci .
      - name: Start the container and wait for the dashboard
        run: |
          docker run -d --name pm -p 8420:8420 -e ADMIN_PASSWORD=ci-password-123 pumpkin-manager:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8420/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8420/api/health
      - name: Log in through the API
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-password-123"}' http://127.0.0.1:8420/api/auth/login
          curl -fsS -b jar http://127.0.0.1:8420/api/system | head -c 300
      # Modpack servers download a Java runtime when they need one. This proves that the real builds start inside this (musl)
      # image, for the Java versions Minecraft has asked for so far. Java 8 must be the pinned 8u312 (old Forge for 1.16.5 cannot
      # run on anything newer). Each result is also shown as an annotation.
      - name: Java runs inside the image
        run: |
          failed=0
          for major in 8 17 21 25; do
            if out=$(docker run --rm -e DATA_DIR=/tmp/pm-data pumpkin-manager:ci python -m pumpkin_manager java-install "$major" 2>&1) \
               && { [ "$major" != 8 ] || echo "$out" | grep -q '1\.8\.0_312'; }; then
              echo "::notice title=Java $major::$(echo "$out" | tail -n 3 | tr '\n' ' ')"
            else
              echo "::error title=Java $major does not start in the image, or is not the pinned build::$(echo "$out" | tail -n 8 | tr '\n' ' ')"
              failed=1
            fi
          done
          exit $failed
      - name: Container log
        if: always()
        run: docker logs pm

  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    # Waits for the image smoke test only. The unit tests above run in parallel and report on their own: a test
    # that misbehaves on Linux must stay visible (red cross on the commit) without blocking a deployable image.
    needs: image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case the image name (registries require it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pumpkin-manager" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: What to do next
        run: |
          {
            echo "### Published \`${IMAGE}:latest\`"
            echo ""
            echo "A package published from a public repository is normally public as well. If Unraid still says *denied*"
            echo "when pulling it, open GitHub -> your profile -> **Packages** -> \`pumpkin-manager\` -> **Package settings**"
            echo "-> *Danger Zone* -> **Change visibility** -> Public."
          } >> "$GITHUB_STEP_SUMMARY"
